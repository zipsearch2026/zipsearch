<!DOCTYPE html>
<!--
  index.html
  ----------------------------------------------------------
  집서치(ZIPSEARCH) 화면의 '뼈대'입니다.
  실제 데이터를 불러오고 차트를 그리는 일은 js/ 폴더가 담당합니다.

  [화면 구조 - 리뉴얼]
    1) 헤더: 로고 + 브랜드명 + 태그라인
    2) 본문(app-layout): 좌우 2단
        - 왼쪽 사이드바(sidebar): 지수/기간/이동평균/지역 선택 등 모든 컨트롤
        - 오른쪽 차트영역(charts-area): 선택한 지역별 차트
    3) 푸터: 데이터 출처

  [반응형]
    - PC(넓은 화면): 왼쪽 컨트롤 + 오른쪽 차트 (좌우 2단)
    - 휴대폰(좁은 화면): 컨트롤이 위로, 차트가 아래로 (위아래 1단)
      → CSS의 @media 로 자동 전환됩니다.

  [중요] 컨트롤 요소들의 id(type-toggle, start-select, ma-toggle,
   region-list 등)는 예전과 똑같이 유지합니다. 그래야 기존 JS가
   그대로 동작합니다. 위치(자리)만 사이드바 안으로 옮긴 것입니다.
  ----------------------------------------------------------
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>집서치 ZIPSEARCH · 부동산 가격지수 뷰어</title>

  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body>
  <!-- ===================== 헤더 (브랜드) ===================== -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <!-- 로고 자리(간단한 원형 마크). 나중에 이미지로 교체 가능 -->
        <span class="brand-logo" aria-hidden="true">📈</span>
        <div class="brand-text">
          <h1>집서치 <span class="brand-en">ZIPSEARCH</span></h1>
          <p class="tagline">크게 보면 세상이 달라 보인다</p>
        </div>
      </div>
      <p class="header-note">한국부동산원 주택가격동향조사 · 원자료 · 월별</p>
    </div>
  </header>

  <!-- ===================== 본문: 좌우 2단 ===================== -->
  <div class="app-layout">

    <!-- ---------- 왼쪽 사이드바: 모든 컨트롤 ---------- -->
    <aside class="sidebar">

      <!-- (1) 지수 종류: 매매 / 전세 -->
      <div class="control-block">
        <label class="control-label">지수 종류</label>
        <div class="segmented" id="type-toggle">
          <button class="seg-btn is-active" data-type="sale">매매</button>
          <button class="seg-btn" data-type="jeonse">전세</button>
        </div>
      </div>

      <!-- (2) 기간: 빠른 버튼 + 시작 ~ 끝 드롭다운 -->
      <div class="control-block">
        <label class="control-label">기간</label>

        <!-- 빠른 기간 버튼: 데이터 마지막 달 기준 1/3/5년, 전체 -->
        <div class="quick-period" id="quick-period">
          <button class="quick-btn" data-years="1">1년</button>
          <button class="quick-btn" data-years="3">3년</button>
          <button class="quick-btn" data-years="5">5년</button>
          <button class="quick-btn" data-years="all">전체</button>
        </div>

        <!-- 시작 ~ 끝 드롭다운 (직접 세밀 조정용) -->
        <div class="period-row">
          <select id="start-select" class="select" aria-label="시작 월"></select>
          <span class="tilde">~</span>
          <select id="end-select" class="select" aria-label="끝 월"></select>
        </div>
      </div>

      <!-- (3) 이동평균(MA) 토글 -->
      <div class="control-block">
        <label class="control-label">이동평균선</label>
        <div class="ma-toggle" id="ma-toggle">
          <button class="ma-btn is-active" data-ma="raw">원본</button>
          <button class="ma-btn" data-ma="ma3">3M</button>
          <button class="ma-btn" data-ma="ma6">6M</button>
          <button class="ma-btn" data-ma="ma12">12M</button>
        </div>
      </div>

      <!-- (4) 선택 현황 -->
      <div class="control-block">
        <label class="control-label">선택한 지역</label>
        <div class="count-pill"><span id="selected-count">0</span> / 10</div>
      </div>

      <!-- (5) 지역 선택: 선택 칩 + 접기 버튼 + 접히는 목록 -->
      <div class="control-block region-picker">
        <label class="control-label">지역</label>

        <!-- 선택한 지역 칩(태그). JS가 채움 -->
        <div id="selected-chips" class="selected-chips"></div>

        <!-- 목록 펼침/접힘 버튼 -->
        <button id="picker-toggle" class="picker-toggle" aria-expanded="false">
          <span>지역 선택하기</span>
          <span class="chev">▾</span>
        </button>

        <!-- 접히는 목록 (is-open 일 때만 보임) -->
        <div id="picker-panel" class="picker-panel">
          <input
            type="text"
            id="region-search"
            class="search"
            placeholder="지역 검색 (예: 안양, 강남, 부산)"
          />
          <div id="region-list" class="region-list">
            <p class="loading">지역 목록을 불러오는 중…</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- ---------- 오른쪽: 차트 영역 ---------- -->
    <main class="charts-area">
      <!-- 아무 지역도 안 골랐을 때 안내 -->
      <div id="empty-state" class="empty-state">
        <p>왼쪽에서 지수와 기간을 고르고,<br />지역을 선택하면 차트가 나타납니다.</p>
      </div>

      <!-- 선택한 지역별 차트가 여기에 생깁니다 -->
      <div id="charts-grid" class="charts-grid"></div>
    </main>
  </div>

  <footer class="site-footer">
    <p>데이터 출처: 한국부동산원 주택가격동향조사 (매매·전세 가격지수, 원자료)</p>
    <!-- 법적 면책 문구: 참고용임을 명확히 안내 -->
    <p class="disclaimer">
      본 서비스의 데이터는 한국부동산원 자료를 가공한 것으로, 참고용이며 투자 판단의 근거로 삼지 마십시오.
      데이터의 정확성을 보장하지 않습니다.
    </p>
  </footer>

  <!-- ===================== 스크립트 (순서 중요) ===================== -->
  <script src="js/dataLoader.js"></script>
  <script src="js/chartRenderer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
